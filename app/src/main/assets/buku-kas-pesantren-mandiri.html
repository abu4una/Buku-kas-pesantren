<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Buku Kas Pesantren</title><meta name="theme-color" content="#17483A"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<style>
  :root{
    --ink:#232421; --cover:#1F4B3F; --cover-dark:#163730;
    --paper:#F6F1E1; --paper-line:#E4DBC2;
    --gold:#B8863F; --gold-light:#D9A85C;
    --surplus:#2F7A55; --defisit:#B5442E; --muted:#7A7568;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  .serif{ font-family:Georgia,"Times New Roman",serif; }
  .cover{
    background:linear-gradient(160deg, var(--cover) 0%, var(--cover-dark) 100%);
    padding:26px 20px 34px; position:relative; overflow:hidden;
  }
  .cover::before{
    content:""; position:absolute; top:0; left:0; width:8px; height:100%;
    background:var(--gold); opacity:.9;
  }
  .cover::after{
    content:""; position:absolute; inset:12px; border:1px solid rgba(217,168,92,.5);
    border-radius:4px; pointer-events:none;
  }
  .cover-inner{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; position:relative; z-index:1;}
  .eyebrow{ color:var(--gold-light); letter-spacing:.2em; font-size:10px; text-transform:uppercase; font-weight:600; margin-bottom:6px;}
  .pesantren-name{ color:var(--paper); font-size:20px; font-weight:700; margin:0; }
  .tagline{ color:rgba(246,241,225,.75); font-size:12px; margin-top:6px; font-style:italic;}
  .name-row{ display:flex; align-items:center; gap:8px; cursor:pointer; background:none; border:none; padding:0; text-align:left;}
  .content{ padding:0 16px 110px; margin-top:-16px; }
  .card{ background:#fff; border:1px solid var(--paper-line); border-radius:14px; padding:16px; box-shadow:0 1px 3px rgba(0,0,0,.05); margin-bottom:14px; }
  .card-label{ display:flex; align-items:center; gap:6px; color:var(--muted); font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.03em; margin-bottom:6px;}
  .saldo-value{ color:var(--cover); font-size:30px; font-weight:700; letter-spacing:-0.5px;}
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;}
  .mini-card{ background:#fff; border:1px solid var(--paper-line); border-radius:14px; padding:13px; box-shadow:0 1px 3px rgba(0,0,0,.05);}
  .mini-value{ font-size:16px; font-weight:700;}
  .stempel-row{ display:flex; align-items:center; gap:14px;}
  .stempel{ flex-shrink:0; width:64px; height:64px; border-radius:50%; border:2px solid; display:flex; align-items:center; justify-content:center; transform:rotate(-8deg);}
  .stempel span{ font-size:9px; font-weight:700; text-transform:uppercase; text-align:center;}
  .narasi{ font-size:13.5px; line-height:1.4;}
  .save-warning{ background:#FBEAE5; color:var(--defisit); border-radius:10px; padding:9px 12px; font-size:12px; margin-bottom:14px;}
  h2.section-title{ font-size:14px; font-weight:700; margin:0 0 12px;}
  .chart-row-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;}
  .legend-row{ display:flex; align-items:center; gap:6px; font-size:11px; margin-bottom:5px;}
  .dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0;}
  .search-filter-row{ display:flex; gap:8px; margin-bottom:12px;}
  .search-box{ flex:1; display:flex; align-items:center; gap:6px; background:var(--paper); border-radius:10px; padding:7px 10px;}
  .search-box input{ border:none; background:transparent; outline:none; font-size:12px; width:100%; color:var(--ink);}
  select.filter-select{ font-size:12px; border-radius:10px; padding:7px 8px; background:var(--paper); color:var(--ink); border:none; outline:none;}
  table.ledger{ width:100%; border-collapse:collapse; font-size:12px; min-width:520px;}
  table.ledger thead tr{ border-bottom:1.5px solid var(--cover);}
  table.ledger th{ text-align:left; color:var(--muted); font-weight:600; padding:6px 4px;}
  table.ledger th.num{ text-align:right;}
  table.ledger td{ padding:8px 4px; border-bottom:1px solid var(--paper-line); vertical-align:top;}
  table.ledger td.num{ text-align:right; white-space:nowrap;}
  .tx-desc{ font-weight:500;}
  .tx-cat{ color:var(--muted); font-size:10px;}
  .ledger-wrap{ overflow-x:auto; margin:0 -4px;}
  .empty-note{ color:var(--muted); font-size:12px; text-align:center; padding:30px 10px;}
  .fab-row{ position:fixed; bottom:18px; left:0; right:0; display:flex; justify-content:center; gap:12px; padding:0 16px;}
  .fab{ display:flex; align-items:center; gap:6px; color:#fff; font-size:12.5px; font-weight:600; padding:12px 18px; border-radius:999px; border:none; box-shadow:0 4px 14px rgba(0,0,0,.18); cursor:pointer;}
  .modal-overlay{ position:fixed; inset:0; background:rgba(35,36,33,.5); display:flex; align-items:flex-end; justify-content:center; z-index:50;}
  .modal-box{ width:100%; max-width:420px; background:var(--paper); border-radius:18px 18px 0 0; padding:20px; }
  @media(min-width:640px){ .modal-overlay{ align-items:center;} .modal-box{ border-radius:18px;} }
  .modal-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
  .modal-title{ font-size:14px; font-weight:700;}
  .field{ margin-bottom:10px;}
  .field label{ font-size:11px; font-weight:600; color:var(--muted); display:block; margin-bottom:4px;}
  .field input, .field select{ width:100%; padding:9px 10px; border-radius:10px; border:1px solid var(--paper-line); background:#fff; font-size:13px; color:var(--ink); outline:none;}
  .form-error{ color:var(--defisit); font-size:12px; margin:4px 0;}
  .btn-submit{ width:100%; color:#fff; font-weight:700; font-size:13.5px; padding:11px; border-radius:10px; border:none; margin-top:6px; cursor:pointer;}
  button{ font-family:inherit; cursor:pointer;}
  .icon-btn{ background:none; border:none; padding:2px; display:inline-flex; align-items:center;}
  input[type=text]::placeholder, input[type=number]::placeholder{ color:#b8b2a0;}
  .confirm-del{ display:flex; align-items:center; gap:6px; justify-content:flex-end;}
  .confirm-del button.yakin{ background:none; border:none; color:var(--defisit); font-size:10.5px; font-weight:700;}
  .name-edit-form{ display:flex; align-items:center; gap:8px;}
  .name-edit-form input{ font-size:16px; font-weight:700; padding:5px 8px; border-radius:6px; border:none; width:100%;}
  .name-edit-form button{ background:var(--gold); border:none; border-radius:6px; padding:5px 7px; display:flex;}
</style>

<body>
<div id="app"></div>

<script>
/* ===================== Konstanta ===================== */
var COVER='#1F4B3F', SURPLUS='#2F7A55', DEFISIT='#B5442E', GOLD='#B8863F', MUTED='#7A7568';
var CATEGORY_COLORS=[COVER,GOLD,DEFISIT,'#4A7C9B','#8B6BA8',MUTED];
var INCOME_CATEGORIES=['SPP Santri','Uang Pangkal','Uang Daftar Ulang','Donasi / Infaq','Wakaf Tanah / Bangunan','Usaha Pesantren','Lainnya'];
var EXPENSE_CATEGORIES=['Konsumsi Santri','Gaji Ustadz & Karyawan','Operasional (Listrik/Air/Gas)','Pemeliharaan Gedung','Kegiatan Pendidikan','Pembelian / Pembangunan Tanah & Bangunan','Lainnya'];
var MONTHS_ID=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
var STORAGE_KEY='pesantrenKas.transactions';
var PROFILE_KEY='pesantrenKas.profile';

/* ===================== State ===================== */
var transactions = [];
var profileName = 'Pesantren Kita';
var ui = { showForm:false, formType:'masuk', search:'', filterType:'semua', confirmingId:null, editingName:false };

/* ===================== Util ===================== */
function formatRupiah(n){ var v=Math.round(Number(n)||0); return 'Rp'+v.toLocaleString('id-ID'); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function monthKey(d){ return d.slice(0,7); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

function loadData(){
  try{ var raw=localStorage.getItem(STORAGE_KEY); if(raw) transactions=JSON.parse(raw); }catch(e){ transactions=[]; }
  try{ var p=localStorage.getItem(PROFILE_KEY); if(p) profileName=JSON.parse(p).name; }catch(e){}
}
function saveTransactions(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(transactions)); return true; }
  catch(e){ return false; }
}
function saveProfile(){
  try{ localStorage.setItem(PROFILE_KEY, JSON.stringify({name:profileName})); }catch(e){}
}

/* ===================== Data turunan ===================== */
function getSortedWithBalance(){
  var sorted=transactions.slice().sort(function(a,b){
    if(a.date!==b.date) return a.date<b.date?-1:1;
    return a.createdAt-b.createdAt;
  });
  var running=0;
  return sorted.map(function(t){
    running += t.type==='masuk'? t.amount : -t.amount;
    return Object.assign({}, t, {balance:running});
  });
}
function getCurrentMonthKey(){ return new Date().toISOString().slice(0,7); }
function getBulanIni(){
  var ck=getCurrentMonthKey();
  var list=transactions.filter(function(t){ return monthKey(t.date)===ck; });
  var masuk=list.filter(function(t){return t.type==='masuk';}).reduce(function(s,t){return s+t.amount;},0);
  var keluar=list.filter(function(t){return t.type==='keluar';}).reduce(function(s,t){return s+t.amount;},0);
  return { masuk:masuk, keluar:keluar, net:masuk-keluar, count:list.length };
}
function getMonthlyTrend(){
  var now=new Date(); var arr=[];
  for(var i=5;i>=0;i--){
    var d=new Date(now.getFullYear(), now.getMonth()-i, 1);
    var key=d.toISOString().slice(0,7);
    var label=MONTHS_ID[d.getMonth()].slice(0,3)+' '+String(d.getFullYear()).slice(2);
    var list=transactions.filter(function(t){ return monthKey(t.date)===key; });
    var masuk=list.filter(function(t){return t.type==='masuk';}).reduce(function(s,t){return s+t.amount;},0);
    var keluar=list.filter(function(t){return t.type==='keluar';}).reduce(function(s,t){return s+t.amount;},0);
    arr.push({key:key,label:label,masuk:masuk,keluar:keluar,selisih:masuk-keluar});
  }
  return arr;
}
function getPengeluaranKategoriBulanIni(){
  var ck=getCurrentMonthKey();
  var list=transactions.filter(function(t){ return monthKey(t.date)===ck && t.type==='keluar'; });
  var map={};
  list.forEach(function(t){ map[t.category]=(map[t.category]||0)+t.amount; });
  return Object.keys(map).map(function(k){ return {name:k, value:map[k]}; }).sort(function(a,b){return b.value-a.value;});
}
function getFilteredLedger(){
  var withBalance=getSortedWithBalance().slice().reverse();
  return withBalance.filter(function(t){
    if(ui.filterType!=='semua' && t.type!==ui.filterType) return false;
    var q=ui.search.trim().toLowerCase();
    if(!q) return true;
    return t.description.toLowerCase().indexOf(q)>-1 || t.category.toLowerCase().indexOf(q)>-1;
  });
}

/* ===================== Ikon (SVG mini, tanpa dependensi) ===================== */
function icon(name, color, size){
  color=color||'currentColor'; size=size||14;
  var paths={
    wallet:'<rect x="2" y="6" width="20" height="14" rx="2"/><path d="M2 10h20"/><circle cx="17" cy="15" r="1.2" fill="'+color+'" stroke="none"/>',
    up:'<path d="M12 19V5M5 12l7-7 7 7"/>',
    down:'<path d="M12 5v14M5 12l7 7 7-7"/>',
    plus:'<path d="M12 5v14M5 12h14"/>',
    trash:'<path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6"/>',
    search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
    x:'<path d="M18 6L6 18M6 6l12 12"/>',
    check:'<path d="M20 6L9 17l-5-5"/>',
    pencil:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/>',
    download:'<path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/>',
    book:'<path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/>'
  };
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+(paths[name]||'')+'</svg>';
}

/* ===================== Render: shell ===================== */
function renderApp(){
  var app=document.getElementById('app');
  app.innerHTML =
    '<div class="cover"><div class="cover-inner">'+
      '<div style="min-width:0;flex:1;">'+
        '<div class="eyebrow">Buku Kas Umum</div>'+
        '<div id="nameArea"></div>'+
        '<div class="tagline">Amanah, transparan, dan tercatat</div>'+
      '</div>'+
      '<div style="flex-shrink:0;margin-top:4px;">'+icon('book','#D9A85C',28)+'</div>'+
    '</div></div>'+
    '<div class="content">'+
      '<div id="saveWarning"></div>'+
      '<div class="card" id="cardSaldo"></div>'+
      '<div class="grid2" id="miniCards"></div>'+
      '<div class="card" id="stempelCard"></div>'+
      '<div class="card" id="chartCard"><h2 class="section-title">Tren Arus Kas — 6 Bulan Terakhir</h2><div id="chartWrap"></div></div>'+
      '<div class="card" id="pieCard"><h2 class="section-title">Pengeluaran per Kategori — Bulan Ini</h2><div id="pieWrap"></div></div>'+
      '<div class="card" id="adminCard">'+
      '<div class="chart-row-head"><h2 class="section-title" style="margin:0;">Administrasi & Hak Akses</h2>'+
      '<span style="font-size:10.5px;color:'+MUTED+';">'+(getSession()?roleLabel(getSession().role):'Belum login')+'</span></div>'+
      '<div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:9px;">'+
      '<button id="v3Login" class="fab" style="background:'+COVER+';color:#fff;">'+(getSession()?'Logout':'Login')+'</button>'+
      '<button id="v3Backup" class="fab" style="background:'+COVER+';color:#fff;">Backup</button>'+
      '<button id="v3Restore" class="fab" style="background:'+GOLD+';color:#fff;">Restore</button>'+
      '<button id="v3Users" class="fab" style="background:'+GOLD+';color:#fff;">Pengguna</button>'+
      '<button id="v3AddUser" class="fab" style="background:'+SURPLUS+';color:#fff;">Tambah User</button>'+
      '<button id="v3Audit" class="fab" style="background:'+MUTED+';color:#fff;">Log Aktivitas</button>'+
      '</div>'+
      '<p style="font-size:10.5px;color:'+MUTED+';margin:9px 0 0;">Peran: Admin Utama, Bendahara, Operator, Auditor. Hak akses berlaku pada perangkat ini.</p>'+
      '</div>'+
    <div class="card">'+
        '<div class="chart-row-head"><h2 class="section-title" style="margin:0;">Buku Kas — Rincian Transaksi</h2>'+
          '<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">
          <button id="btnExport" class="icon-btn" style="color:'+COVER+';gap:4px;font-size:12px;font-weight:600;">'+icon('download',COVER,13)+' CSV</button>
          <button id="btnExcel" class="icon-btn" style="color:'+COVER+';gap:4px;font-size:12px;font-weight:600;">Excel</button>
          <button id="btnPdf" class="icon-btn" style="color:'+COVER+';gap:4px;font-size:12px;font-weight:600;">PDF</button>
          <button id="btnBackup" class="icon-btn" style="color:'+GOLD+';gap:4px;font-size:12px;font-weight:600;">Backup</button>
          <button id="btnRestore" class="icon-btn" style="color:'+GOLD+';gap:4px;font-size:12px;font-weight:600;">Restore</button>
          <input id="backupFile" type="file" accept=".json,application/json" style="display:none">
        </div>'+
        '</div>'+
        '<div class="search-filter-row">'+
          '<div class="search-box">'+icon('search',MUTED,13)+'<input id="searchInput" type="text" placeholder="Cari keterangan/kategori"></div>'+
          '<select id="filterSelect" class="filter-select">'+
            '<option value="semua">Semua</option><option value="masuk">Masuk</option><option value="keluar">Keluar</option>'+
          '</select>'+
        '</div>'+
        '<div id="ledgerWrap"></div>'+
      '</div>'+
    '</div>'+
    '<div class="fab-row">'+
      '<button class="fab" id="btnAddMasuk" style="background:'+SURPLUS+';">'+icon('plus','#fff',15)+' Masuk</button>'+
      '<button class="fab" id="btnAddKeluar" style="background:'+DEFISIT+';">'+icon('plus','#fff',15)+' Keluar</button>'+
    '</div>'+
    '<div id="modalArea"></div>';

  renderName();
  renderDashboard();
  renderChart();
  renderPie();
  renderLedgerTable();
  renderModal();

  document.getElementById('searchInput').value = ui.search;
  document.getElementById('filterSelect').value = ui.filterType;

  document.getElementById('searchInput').addEventListener('input', function(e){
    ui.search = e.target.value; renderLedgerTable();
  });
  document.getElementById('filterSelect').addEventListener('change', function(e){
    ui.filterType = e.target.value; renderLedgerTable();
  });

/* ===================== Render: grafik tren (SVG manual) ===================== */
function renderChart(){
  var data=getMonthlyTrend();
  var W=320, H=190, padL=34, padR=6, padT=10, padB=22;
  var vals=[]; data.forEach(function(d){ vals.push(d.masuk,d.keluar,d.selisih); });
  var maxV=Math.max.apply(null, vals.concat([1]));
  var minV=Math.min.apply(null, vals.concat([0]));
  if(minV>0) minV=0;
  var range = (maxV-minV)||1;
  function yPix(v){ return padT + (maxV-v)/range * (H-padT-padB); }
  var zeroY = yPix(0);
  var groupW = (W-padL-padR)/data.length;
  var barW = Math.min(11, groupW/3.2);

  var bars='', line='', xlabels='';
  var linePts=[];
  data.forEach(function(d, i){
    var cx = padL + groupW*i + groupW/2;
    var xMasuk = cx - barW - 2, xKeluar = cx + 2;
    var yM=yPix(d.masuk), yK=yPix(d.keluar);
    bars += '<rect x="'+xMasuk+'" y="'+Math.min(yM,zeroY)+'" width="'+barW+'" height="'+Math.abs(zeroY-yM)+'" rx="2" fill="'+SURPLUS+'"/>';
    bars += '<rect x="'+xKeluar+'" y="'+Math.min(yK,zeroY)+'" width="'+barW+'" height="'+Math.abs(zeroY-yK)+'" rx="2" fill="'+DEFISIT+'"/>';
    linePts.push(cx+','+yPix(d.selisih));
    xlabels += '<text x="'+cx+'" y="'+(H-6)+'" font-size="8.5" fill="'+MUTED+'" text-anchor="middle">'+d.label+'</text>';
  });
  line = '<polyline points="'+linePts.join(' ')+'" fill="none" stroke="'+GOLD+'" stroke-width="2"/>';
  data.forEach(function(d,i){
    var cx = padL + groupW*i + groupW/2;
    line += '<circle cx="'+cx+'" cy="'+yPix(d.selisih)+'" r="2.6" fill="'+GOLD+'"/>';
  });

  var svg = '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="max-width:100%;">'+
    '<line x1="'+padL+'" y1="'+zeroY+'" x2="'+(W-padR)+'" y2="'+zeroY+'" stroke="'+'#E4DBC2'+'" stroke-width="1"/>'+
    bars + line + xlabels +
    '</svg>';

  document.getElementById('chartWrap').innerHTML =
    svg +
    '<div style="display:flex;gap:14px;margin-top:6px;justify-content:center;">'+
      legendItem(SURPLUS,'Pemasukan')+legendItem(DEFISIT,'Pengeluaran')+legendItem(GOLD,'Selisih')+
    '</div>';
}
function legendItem(color,label){
  return '<span style="display:flex;align-items:center;gap:4px;font-size:10.5px;color:'+MUTED+';"><span class="dot" style="background:'+color+';"></span>'+label+'</span>';
}

/* ===================== Render: donut kategori (SVG manual) ===================== */
function renderPie(){
  var data=getPengeluaranKategoriBulanIni();
  var wrap=document.getElementById('pieWrap');
  if(data.length===0){
    wrap.innerHTML='<p class="empty-note">Belum ada pengeluaran bulan ini.</p>';
    return;
  }
  var total=data.reduce(function(s,d){return s+d.value;},0);
  var r=42, cx=50, cy=50, circumference=2*Math.PI*r;
  var offsetAcc=0;
  var circles='';
  data.forEach(function(d,i){
    var frac=d.value/total;
    var dash=frac*circumference;
    circles += '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+CATEGORY_COLORS[i%CATEGORY_COLORS.length]+'" stroke-width="16" stroke-dasharray="'+dash+' '+(circumference-dash)+'" stroke-dashoffset="'+(-offsetAcc)+'" transform="rotate(-90 '+cx+' '+cy+')"/>';
    offsetAcc += dash;
  });
  var legend = data.map(function(d,i){
    return '<div style="display:flex;align-items:center;gap:6px;font-size:11px;margin-bottom:5px;">'+
      '<span class="dot" style="background:'+CATEGORY_COLORS[i%CATEGORY_COLORS.length]+';"></span>'+
      '<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+escapeHtml(d.name)+'</span>'+
      '<span style="color:'+MUTED+';flex-shrink:0;">'+formatRupiah(d.value)+'</span></div>';
  }).join('');
  wrap.innerHTML = '<div style="display:flex;align-items:center;gap:14px;">'+
    '<svg viewBox="0 0 100 100" width="120" height="120" style="flex-shrink:0;">'+circles+'</svg>'+
    '<div style="flex:1;min-width:0;">'+legend+'</div></div>';
}

/* ===================== Render: tabel ledger ===================== */
function renderLedgerTable(){
  var list=getFilteredLedger();
  var wrap=document.getElementById('ledgerWrap');
  if(list.length===0){
    wrap.innerHTML = '<p class="empty-note">'+(transactions.length===0 ? 'Buku kas masih kosong. Mulai catat transaksi pertama dengan tombol + di bawah.' : 'Tidak ada transaksi yang cocok dengan pencarian/filter.')+'</p>';
    return;
  }
  var rows = list.map(function(t, idx){
    var dateFmt = t.date.slice(8,10)+'/'+t.date.slice(5,7)+'/'+t.date.slice(0,4);
    var rowBg = ui.confirmingId===t.id ? '#FBEAE5' : (idx%2===0 ? '#fff' : '#F6F1E1');
    var actionCell = ui.confirmingId===t.id
      ? '<div class="confirm-del"><button class="yakin" data-del="'+t.id+'">Hapus?</button><button class="icon-btn" data-cancel-del="'+t.id+'">'+icon('x',MUTED,12)+'</button></div>'
      : '<button class="icon-btn" data-del="'+t.id+'">'+icon('trash',MUTED,13)+'</button>';
    return '<tr style="background:'+rowBg+';">'+
      '<td style="white-space:nowrap;">'+dateFmt+'</td>'+
      '<td><div class="tx-desc">'+escapeHtml(t.description)+'</div><div class="tx-cat">'+escapeHtml(t.category)+'</div></td>'+
      '<td class="num" style="color:'+SURPLUS+';">'+(t.type==='masuk'?formatRupiah(t.amount):'—')+'</td>'+
      '<td class="num" style="color:'+DEFISIT+';">'+(t.type==='keluar'?formatRupiah(t.amount):'—')+'</td>'+
      '<td class="num" style="color:'+COVER+';font-weight:600;">'+formatRupiah(t.balance)+'</td>'+
      '<td class="num">'+actionCell+'</td>'+
      '</tr>';
  }).join('');

  wrap.innerHTML = '<div class="ledger-wrap"><table class="ledger"><thead><tr>'+
    '<th>Tanggal</th><th>Uraian</th><th class="num">Masuk</th><th class="num">Keluar</th><th class="num">Saldo</th><th></th>'+
    '</tr></thead><tbody>'+rows+'</tbody></table></div>';

  wrap.querySelectorAll('[data-del]').forEach(function(btn){
    btn.addEventListener('click', function(){ handleDelete(btn.getAttribute('data-del')); });
  });
  wrap.querySelectorAll('[data-cancel-del]').forEach(function(btn){
    btn.addEventListener('click', function(){ ui.confirmingId=null; renderLedgerTable(); });
  });
}

function handleDelete(id){
  if(!isAdmin()){ alert('Silakan Login Admin terlebih dahulu untuk menghapus transaksi.'); adminLogin(); return; }
  if(ui.confirmingId===id){
    transactions = transactions.filter(function(t){ return t.id!==id; });
    window.__saveFailed = !saveTransactions();
    ui.confirmingId=null;
    renderDashboard(); renderChart(); renderPie(); renderLedgerTable(); if(window.renderFundDashboard) renderFundDashboard();
  } else {
    ui.confirmingId=id; renderLedgerTable();
  }
}

/* ===================== v3.0 Role-Based Administration ===================== */
var USERS_KEY='pesantrenKas.users.v3';
var AUDIT_KEY='pesantrenKas.audit.v3';
var SESSION_KEY='pesantrenKas.userSession.v3';
function defaultUsers(){return [
{id:'u1',name:'Admin Utama',username:'admin',role:'admin',pin:'1234',active:true},
{id:'u2',name:'Bendahara',username:'bendahara',role:'bendahara',pin:'2345',active:true},
{id:'u3',name:'Operator',username:'operator',role:'operator',pin:'3456',active:true},
{id:'u4',name:'Auditor',username:'auditor',role:'auditor',pin:'4567',active:true}
];}
function getUsers(){try{var x=JSON.parse(localStorage.getItem(USERS_KEY)||'null');return Array.isArray(x)&&x.length?x:defaultUsers();}catch(e){return defaultUsers();}}
function saveUsers(x){localStorage.setItem(USERS_KEY,JSON.stringify(x));}
function getSession(){try{return JSON.parse(sessionStorage.getItem(SESSION_KEY)||'null');}catch(e){return null;}}
function setSession(u){sessionStorage.setItem(SESSION_KEY,JSON.stringify({id:u.id,name:u.name,username:u.username,role:u.role}));}
function clearSession(){sessionStorage.removeItem(SESSION_KEY);}
function roleLabel(r){return {admin:'Admin Utama',bendahara:'Bendahara',operator:'Operator',auditor:'Auditor'}[r]||r;}
function can(role,action){var map={admin:['view','add','edit','delete','backup','restore','export','users','audit'],bendahara:['view','add','edit','delete','backup','restore','export','audit'],operator:['view','add','edit','export'],auditor:['view','export','audit']};return (map[role]||[]).indexOf(action)>=0;}
function audit(action,detail){var ss=getSession(),logs=[];try{logs=JSON.parse(localStorage.getItem(AUDIT_KEY)||'[]');}catch(e){}logs.unshift({time:new Date().toISOString(),user:ss?ss.username:'system',role:ss?ss.role:'system',action:action,detail:detail||''});localStorage.setItem(AUDIT_KEY,JSON.stringify(logs.slice(0,500)));}
function requireRole(action){var ss=getSession();if(!ss){alert('Silakan login terlebih dahulu.');return false;}if(!can(ss.role,action)){alert('Akses ditolak untuk '+roleLabel(ss.role)+'.');return false;}return true;}
function v3Login(){var username=prompt('Username:');if(username===null)return;var pin=prompt('PIN:');if(pin===null)return;var u=getUsers().find(function(x){return x.active&&x.username===username&&x.pin===pin;});if(!u){alert('Username atau PIN salah.');return;}setSession(u);audit('LOGIN','Login berhasil');renderApp();}
function v3Logout(){audit('LOGOUT','Keluar');clearSession();renderApp();}
function v3AddUser(){if(!requireRole('users'))return;var name=prompt('Nama pengguna:');if(!name)return;var username=prompt('Username:');if(!username)return;var role=prompt('Peran: admin / bendahara / operator / auditor','operator');if(['admin','bendahara','operator','auditor'].indexOf(role)<0)return alert('Peran tidak valid.');var pin=prompt('PIN minimal 4 digit:');if(!pin||!/^\d{4,}$/.test(pin))return alert('PIN tidak valid.');var users=getUsers();if(users.some(function(u){return u.username===username;}))return alert('Username sudah digunakan.');users.push({id:'u'+Date.now(),name:name,username:username,role:role,pin:pin,active:true});saveUsers(users);audit('ADD_USER',username+' / '+role);alert('Pengguna ditambahkan.');renderApp();}
function v3ListUsers(){if(!requireRole('users'))return;alert(getUsers().map(function(u){return u.username+' — '+u.name+' — '+roleLabel(u.role)+' — '+(u.active?'Aktif':'Nonaktif');}).join('\n'));}
function v3AuditLog(){if(!requireRole('audit'))return;var logs=[];try{logs=JSON.parse(localStorage.getItem(AUDIT_KEY)||'[]');}catch(e){}alert(logs.slice(0,30).map(function(x){return new Date(x.time).toLocaleString('id-ID')+' | '+x.user+' | '+x.action+' | '+x.detail;}).join('\n')||'Belum ada log.');}

/* ===================== Backup / Restore / Excel / PDF ===================== */
function downloadFile(content, filename, mime){
  var blob=new Blob([content],{type:mime});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){URL.revokeObjectURL(url);},1000);
}
function exportBackup(){
  var payload={
    app:'Buku Kas Pesantren',
    backupVersion:1,
    exportedAt:new Date().toISOString(),
    profile:{name:profileName},
    transactions:transactions
  };
  downloadFile(JSON.stringify(payload,null,2),'backup-buku-kas-pesantren.json','application/json');
}
function restoreBackup(file){
  var r=new FileReader();
  r.onload=function(e){
    try{
      var d=JSON.parse(e.target.result);
      if(!d || !Array.isArray(d.transactions)) throw new Error('Format backup tidak valid');
      if(!confirm('Restore akan mengganti data transaksi saat ini. Lanjutkan?')) return;
      transactions=d.transactions;
      if(d.profile && d.profile.name) profileName=String(d.profile.name);
      saveTransactions(); saveProfile(); renderApp();
      alert('Backup berhasil dipulihkan.');
    }catch(err){alert('Restore gagal: '+err.message);}
  };
  r.readAsText(file);
}
function exportExcel(){
  var rows=getSortedWithBalance();
  var table='<table border="1"><tr><th>Tanggal</th><th>Uraian</th><th>Kategori</th><th>Jenis</th><th>Pemasukan</th><th>Pengeluaran</th><th>Saldo</th></tr>';
  rows.forEach(function(t){
    table+='<tr><td>'+escapeHtml(t.date)+'</td><td>'+escapeHtml(t.description)+'</td><td>'+escapeHtml(t.category)+'</td><td>'+(t.type==='masuk'?'Pemasukan':'Pengeluaran')+'</td><td>'+(t.type==='masuk'?t.amount:'')+'</td><td>'+(t.type==='keluar'?t.amount:'')+'</td><td>'+t.balance+'</td></tr>';
  });
  table+='</table>';
  var xls='<!DOCTYPE html><html><head><meta charset="UTF-8"></head><body><h2>Buku Kas Pesantren</h2>'+table+'</body></html>';
  downloadFile(xls,'buku-kas-pesantren.xls','application/vnd.ms-excel');
}
function exportPDF(){
  var rows=getSortedWithBalance();
  var w=window.open('','_blank');
  if(!w){alert('Izinkan pop-up untuk membuat laporan PDF.');return;}
  var body=rows.map(function(t){
    return '<tr><td>'+escapeHtml(t.date)+'</td><td>'+escapeHtml(t.description)+'</td><td>'+escapeHtml(t.category)+'</td><td class="num">'+(t.type==='masuk'?formatRupiah(t.amount):'')+'</td><td class="num">'+(t.type==='keluar'?formatRupiah(t.amount):'')+'</td><td class="num">'+formatRupiah(t.balance)+'</td></tr>';

    '<div class="field"><label>Keterangan</label><input type="text" id="fDesc" placeholder="'+placeholderDesc+'"></div>'+
    '<div class="form-error" id="fError"></div>'+
    '<button type="submit" class="btn-submit" style="background:'+color+';">Simpan Transaksi</button>'+
    '</form></div>';

  document.getElementById('overlay').addEventListener('click', function(e){ if(e.target.id==='overlay') closeForm(); });
  document.getElementById('closeModal').addEventListener('click', closeForm);
  document.getElementById('txForm').addEventListener('click', function(e){ e.stopPropagation(); });
  document.getElementById('txForm').addEventListener('submit', function(e){
    e.preventDefault();
    var amount=Number(document.getElementById('fAmount').value);
    var desc=document.getElementById('fDesc').value.trim();
    var errEl=document.getElementById('fError');
    if(!amount || isNaN(amount) || amount<=0){ errEl.textContent='Jumlah harus berupa angka lebih dari 0.'; return; }
    if(!desc){ errEl.textContent='Keterangan tidak boleh kosong.'; return; }
    var newTx={
      id:uid(), type:type, date:document.getElementById('fDate').value,
      category:document.getElementById('fCategory').value, amount:amount, description:desc, createdAt:Date.now()
    };
    transactions.push(newTx);
    window.__saveFailed = !saveTransactions();
    closeForm();
    renderDashboard(); renderChart(); renderPie(); renderLedgerTable(); if(window.renderFundDashboard) renderFundDashboard();
  });
}

/* ===================== Init ===================== */
loadData();
renderApp();

  function getFundSummary(){
    var out={Operasional:{masuk:0,keluar:0},Pendidikan:{masuk:0,keluar:0},Wakaf:{masuk:0,keluar:0}};
    transactions.forEach(function(t){
      var f=t.fund||'Operasional';
      if(!out[f]) out[f]={masuk:0,keluar:0};
      if(t.type==='masuk') out[f].masuk += Number(t.amount)||0;
      else out[f].keluar += Number(t.amount)||0;
    });
    return out;
  }

  function renderFundDashboard(){
    var el=document.getElementById('fundDashboard');
    if(!el)return;
    var d=getFundSummary();
    var html='<h2 class="section-title">Kontrol 3 Dana</h2>'+
      '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;">';
    ['Operasional','Pendidikan','Wakaf'].forEach(function(f){
      var saldo=d[f].masuk-d[f].keluar;
      html+='<div style="background:#F6F1E1;border-radius:11px;padding:10px;">'+
        '<div style="font-size:10px;font-weight:700;color:'+MUTED+';">Dana '+f+'</div>'+
        '<div style="font-size:15px;font-weight:800;color:'+COVER+';margin:4px 0;">'+formatRupiah(saldo)+'</div>'+
        '<div style="font-size:9px;color:'+SURPLUS+';">Masuk '+formatRupiah(d[f].masuk)+'</div>'+
        '<div style="font-size:9px;color:'+DEFISIT+';">Keluar '+formatRupiah(d[f].keluar)+'</div>'+
      '</div>';
    });
    html+='</div>'+
      '<div style="font-size:10px;color:'+MUTED+';margin-top:9px;">Dana Wakaf dipisahkan dari Operasional dan Pendidikan agar aliran penggunaannya mudah ditelusuri.</div>';
    el.innerHTML=html;
  }

  function injectFundDashboard(){
    if(document.getElementById('fundDashboard'))return;
    var target=document.querySelector('.content');
    var saldo=document.getElementById('cardSaldo');
    if(!target || !saldo)return;
    var el=document.createElement('div');
    el.id='fundDashboard';
    el.className='card';
    saldo.parentNode.insertBefore(el,saldo.nextSibling);
    renderFundDashboard();
  }

  var originalRenderDashboard=window.renderDashboard;
  setTimeout(function(){
    injectFundDashboard();
    renderFundDashboard();
  },50);

</script>
