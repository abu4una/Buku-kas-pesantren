name: Build APK Buku Kas Pesantren

# Workflow ini otomatis meng-compile project Android menjadi file APK
# yang bisa langsung di-install ke HP, tanpa perlu install Android Studio.
#
# Cara pakai:
# 1. Buat repository baru di GitHub (boleh Private).
# 2. Upload seluruh isi folder project ini (termasuk folder .github ini)
#    ke repository tersebut.
# 3. Buka tab "Actions" di repository -> workflow "Build APK Buku Kas Pesantren"
#    akan otomatis berjalan (atau klik "Run workflow" untuk menjalankan manual).
# 4. Setelah selesai (proses ambil beberapa menit), buka hasil run tersebut,
#    scroll ke bagian "Artifacts", lalu download "buku-kas-pesantren-apk".
# 5. Extract zip hasil download -> di dalamnya ada file .apk -> kirim ke HP -> install.

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK (debug, siap install)
        run: gradle assembleDebug --no-daemon

      - name: Upload APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: buku-kas-pesantren-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
